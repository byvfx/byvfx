<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img">
  <title>byvfx: Brandon Young's home page</title>
  <defs>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#1084d0"/>
    </linearGradient>
    <clipPath id="status"><rect x="9" y="208" width="822" height="16"/></clipPath>
  </defs>
  <style>
    .ui { font-family: Tahoma, Verdana, Geneva, 'DejaVu Sans', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
    .word { font-family: Impact, 'Arial Black', 'Haettenschweiler', sans-serif; font-size: 68px; letter-spacing: 6px; text-anchor: middle; }
    .mid { text-anchor: middle; }
    .tw { animation: tw 2.4s steps(1) infinite; }
    .tw2 { animation: tw 3.1s steps(1) infinite .8s; }
    .scroll { animation: scroll 30s linear infinite; }
    @keyframes tw { 50% { opacity: .15; } }
    @keyframes scroll { from { transform: translateX(840px); } to { transform: translateX(-1250px); } }
    @media (prefers-reduced-motion: reduce) {
      .tw, .tw2 { animation: none; }
      .scroll { animation: none; transform: translateX(14px); }
    }
  </style>

  <!-- the window -->
  <g shape-rendering="crispEdges">
    <rect width="840" height="230" fill="#000"/>
    <rect width="839" height="229" fill="#dfdfdf"/>
    <rect x="1" y="1" width="838" height="228" fill="#808080"/>
    <rect x="1" y="1" width="837" height="227" fill="#fff"/>
    <rect x="2" y="2" width="836" height="226" fill="#c0c0c0"/>
    <rect x="4" y="4" width="832" height="20" fill="url(#bar)"/>
    <!-- title bar buttons -->
    <g fill="#c0c0c0" stroke="#000" stroke-width="1">
      <rect x="782.5" y="7.5" width="15" height="13"/>
      <rect x="798.5" y="7.5" width="15" height="13"/>
      <rect x="816.5" y="7.5" width="15" height="13"/>
    </g>
    <rect x="786" y="16" width="7" height="2" fill="#000"/>
    <rect x="802" y="10" width="8" height="8" fill="none" stroke="#000" stroke-width="1"/>
    <rect x="802" y="10" width="8" height="2" fill="#000"/>
    <path d="M820 10l8 8M828 10l-8 8" stroke="#000" stroke-width="1.6" shape-rendering="auto"/>
    <!-- content well -->
    <rect x="6" y="46" width="828" height="156" fill="#808080"/>
    <rect x="7" y="47" width="827" height="155" fill="#fff"/>
    <rect x="7" y="47" width="826" height="154" fill="#000010"/>
    <!-- status bar well -->
    <rect x="6" y="206" width="828" height="20" fill="#808080"/>
    <rect x="7" y="207" width="827" height="19" fill="#fff"/>
    <rect x="7" y="207" width="826" height="18" fill="#c0c0c0"/>
  </g>

  <text class="ui" x="10" y="18" font-size="12" font-weight="bold" fill="#fff">byvfx - Home Page</text>
  <text class="ui" x="12" y="39" font-size="11" fill="#000"><tspan text-decoration="underline">F</tspan>ile   <tspan dx="10" text-decoration="underline">E</tspan>dit   <tspan dx="10" text-decoration="underline">V</tspan>iew   <tspan dx="10" text-decoration="underline">G</tspan>o   <tspan dx="10">F<tspan text-decoration="underline">a</tspan>vorites</tspan>   <tspan dx="10" text-decoration="underline">H</tspan>elp</text>

  <!-- stars -->
  <g fill="#fff" shape-rendering="crispEdges">
    <rect x="40" y="70" width="2" height="2"/><rect x="118" y="150" width="2" height="2" class="tw"/>
    <rect x="96" y="96" width="1" height="1"/><rect x="170" y="62" width="1" height="1"/>
    <rect x="214" y="176" width="2" height="2"/><rect x="62" y="182" width="1" height="1" class="tw2"/>
    <rect x="640" y="66" width="2" height="2" class="tw2"/><rect x="700" y="170" width="2" height="2"/>
    <rect x="760" y="92" width="1" height="1"/><rect x="792" y="148" width="2" height="2" class="tw"/>
    <rect x="610" y="184" width="1" height="1"/><rect x="738" y="60" width="1" height="1"/>
    <rect x="300" y="60" width="1" height="1" class="tw"/><rect x="540" y="188" width="1" height="1"/>
  </g>

  <text class="mono mid" x="420" y="72" font-size="13" fill="#ffea00">~ welcome to my home page ~</text>
  <text class="word" x="424" y="144" fill="#ff00aa">BYVFX</text>
  <text class="word" x="416" y="140" fill="#00e5ff">BYVFX</text>
  <text class="word" x="420" y="142" fill="#fff">BYVFX</text>
  <text class="mono mid" x="420" y="174" font-size="14" fill="#c0c0c0">Brandon Young · VFX artist and technical generalist</text>
  <text class="mono mid" x="420" y="191" font-size="12" fill="#00ff66">I build the tools between the pixels and the pipeline.</text>

  <!-- status bar marquee -->
  <g clip-path="url(#status)">
    <text class="mono scroll" x="0" y="220" font-size="12" fill="#000">*** welcome to my corner of github *** now building: BIF, a USD-native scene assembler, and Floki, a GPU-accelerated EXR viewer *** if it glows, explodes, or involves code, I'm probably into it ***</text>
  </g>
</svg>
