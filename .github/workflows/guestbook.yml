name: guestbook

# A visitor opens an issue titled "guestbook: <message>". Nothing shows on the profile until
# the owner adds the "guestbook" label (only people with triage rights can label), which is
# the approval: the signature is then written into README.md and the issue closed.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: guestbook
  cancel-in-progress: false

jobs:
  sign:
    if: github.event.label.name == 'guestbook' && startsWith(github.event.issue.title, 'guestbook:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Add the signature
        env:
          TITLE: ${{ github.event.issue.title }}
          LOGIN: ${{ github.event.issue.user.login }}
          NUMBER: ${{ github.event.issue.number }}
        run: python3 .github/scripts/guestbook.py README.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "guestbook: a new signature"
          git push
      - name: Thank and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Thanks for signing! Your line is on the profile now."
