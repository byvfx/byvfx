name: counter

# Redraws the "public repos" odometer button once a week, and on demand.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw the buttons
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 assets/make.py assets "$(gh api "users/$GITHUB_REPOSITORY_OWNER" --jq .public_repos)"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "counter: public repos"
          git push
